name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        poc:
          - 01-cdc-debezium-kafka-delta
          - 02-kafka-to-adf-event-driven
          - 03-iceberg-vs-delta
          - 04-metadata-driven-adf
          - 05-aws-s3-lambda-glue
          - 06-snowflake-optimization
    defaults:
      run:
        working-directory: ${{ matrix.poc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-aws-s3-lambda-glue/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

  cdc-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: 01-cdc-debezium-kafka-delta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/e2e.py
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
